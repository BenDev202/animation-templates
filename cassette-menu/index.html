<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassette Menu Tutorial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-logo">ANALOG BLOOM</div>
        <div class="nav-toggler">MENU</div>
    </nav>

    <div class="menu-overlay">
        <div class="menu-overlay-bg"></div>
        <div class="menu-media">
            <!-- Tapes are placed BEFORE the player to stack behind it -->
            <div class="tape"><img src="menu-item-1.svg" alt="Discography"></div>
            <div class="tape"><img src="menu-item-2.svg" alt="Tour Dates"></div>
            <div class="tape"><img src="menu-item-3.svg" alt="The Story"></div>
            <div class="tape"><img src="menu-item-4.svg" alt="Merch"></div>
            <div class="player"><img src="cassette.svg" alt="Cassette Player"></div>
        </div>
    </div>

    <section class="hero">
        <h1>SLIDE ONE OUT</h1>
    </section>

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
