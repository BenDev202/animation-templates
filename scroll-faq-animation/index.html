<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Intro Section -->
<section class="intro">
  <h1>FAQ Chat Animation</h1>
</section>

<!-- FAQ Section -->
<section class="faq">
  <h2>Frequently Asked Questions</h2>
  <div class="container">
    <div class="item">
      <!-- Question Row -->
      <div class="row question">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>What is your return policy?</p>
          </div>
        </div>
      </div>
      <!-- Answer Row -->
      <div class="row answer">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>We offer a 30-day return policy with a full refund.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="item">
      <div class="row question">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>How long does shipping take?</p>
          </div>
        </div>
      </div>
      <div class="row answer">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>Shipping usually takes 5-7 business days.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="item">
      <div class="row question">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>Do you ship internationally?</p>
          </div>
        </div>
      </div>
      <div class="row answer">
        <div class="message">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
          <div class="content">
            <p>Yes, we ship worldwide with additional fees.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Outro Section -->
<section class="outro">
  <h1>Thanks for watching!</h1>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.27/bundled/lenis.min.js"></script>
<script src="script.js"></script>
</body>
</html>
